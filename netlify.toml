# 새 앱(Vite) 빌드 결과(dist)를 내보냅니다. 기존 앱 설정은 legacy/netlify.toml 에 있습니다.
[build]
  command = "npm run typecheck && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; connect-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; frame-src https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; manifest-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
