[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; connect-src 'self' https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; frame-src https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)"
